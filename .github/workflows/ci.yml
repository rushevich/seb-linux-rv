name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libqt6svg6-dev \
            qt6-base-dev \
            qt6-tools-dev-tools \
            qt6-webengine-dev \
            pkg-config \
            zlib1g-dev

      - name: Build
        run: ./scripts/build.sh

      - name: CMake configure (optional WPE)
        run: |
          cmake -S . -B build-cmake \
            -DSEB_BROWSER_ENGINE_WPE=OFF \
            -DRISCV_HARDENED_BUILD=OFF
          cmake --build build-cmake -j

      - name: Verify version
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build/bin/safe-exam-browser --version
